services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-erato_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-erato_password}
      MONGO_INITDB_DATABASE: ${MONGODB_DB:-erato}
    volumes:
      - erato-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - MONGODB_URI=${MONGODB_URI:-mongodb://erato_admin:erato_password@mongo:27017/erato?authSource=admin}
      - MONGODB_DB=${MONGODB_DB:-erato}
      - JWT_SECRET=${JWT_SECRET}
      - ACCESS_TOKEN_TTL_MINUTES=${ACCESS_TOKEN_TTL_MINUTES:-15}
      - REFRESH_TOKEN_TTL_DAYS=${REFRESH_TOKEN_TTL_DAYS:-30}
      - INVITE_TOKEN_TTL_DAYS=${INVITE_TOKEN_TTL_DAYS:-14}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_FOLDER_PREFIX=${CLOUDINARY_FOLDER_PREFIX:-erato}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:5173}
    volumes:
      - .:/app:z
    depends_on:
      mongo:
        condition: service_healthy
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app/frontend
    environment:
      - BACKEND_URL=http://backend:8000
    volumes:
      - .:/app:z
      - /app/frontend/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host"]

volumes:
  erato-mongo-data:
