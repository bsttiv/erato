<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Libre+Franklin:wght@300..700&display=swap">

</head>
<body>
<div id="root" class="er-stage er-row"></div>
<script>
  var E = window.Erato, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(E.Button, { variant: 'primary', icon: 'plus' }, 'Nueva composición'),
    h(E.Button, null, 'Editar'),
    h(E.Button, { variant: 'ghost' }, 'Cancelar'),
    h(E.Button, { variant: 'danger' }, 'Borrar'),
    h(E.Button, { size: 'sm', icon: 'play' }, 'Escuchar demo')));
</script>
</body>
</html>
